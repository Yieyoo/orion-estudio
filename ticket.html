<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Comprobante de pago · Orion Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@800&family=Sora:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f5f3ee; --card: #fff; --ink: #17191d; --muted: #686c72; --line: #e3e1da; --blue: #365cf5; --green: #1f9d6b; --amber: #b7760f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 "DM Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { width: min(640px, 100%); margin: 0 auto; padding: 40px 16px 60px; }
    .ticket { background: var(--card); border: 1px solid var(--line); box-shadow: 0 20px 50px #11131b12; }
    .t-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 28px 30px 24px; background: #0b101b; color: #f6f8ff; }
    .brand { display: flex; gap: 10px; align-items: center; }
    .brand-mark { font: 800 34px/.9 Manrope, sans-serif; letter-spacing: -5px; }
    .brand-mark span { color: #8da6ff; }
    .brand-name { font: 800 16px/.9 Manrope, sans-serif; letter-spacing: -.8px; }
    .brand-name span { display: block; margin-top: 6px; color: #8e97ab; font: 8px "DM Mono", monospace; letter-spacing: 1.4px; }
    .t-doc { text-align: right; }
    .t-doc small { display: block; color: #aeb6c8; font: 9px "DM Mono", monospace; letter-spacing: 1.2px; }
    .t-doc strong { display: block; margin-top: 6px; font: 600 22px Sora, sans-serif; letter-spacing: -.02em; }
    .t-body { padding: 26px 30px 8px; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: 12px; background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c); }
    .status:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 20px 0 24px; background: var(--line); border: 1px solid var(--line); }
    .meta div { padding: 12px 14px; background: var(--card); }
    .label { display: block; margin-bottom: 3px; color: var(--muted); font: 9px "DM Mono", monospace; letter-spacing: 1.1px; text-transform: uppercase; }
    .meta b { font-weight: 600; word-break: break-word; }
    .plan { margin: 0 0 6px; font: 600 20px Sora, sans-serif; letter-spacing: -.02em; }
    .plan-price { margin: 0 0 8px; color: var(--muted); }
    .plan-price b { color: var(--ink); font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0 4px; }
    th { padding: 8px 0; text-align: left; color: var(--muted); font: 9px "DM Mono", monospace; letter-spacing: 1px; text-transform: uppercase; font-weight: 400; border-bottom: 1px solid var(--line); }
    td { padding: 11px 0; border-bottom: 1px solid #f0eee8; vertical-align: top; }
    .num { padding-left: 14px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .totals { margin: 8px 0 22px auto; width: min(280px, 100%); }
    .totals div { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
    .totals .grand { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--ink); font: 600 17px Sora, sans-serif; }
    .totals .paid { color: var(--green); font-weight: 600; }
    .totals .due { color: var(--amber); font-weight: 700; }
    .bar { height: 6px; margin: 4px 0 26px; background: #eeece6; border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
    h2 { margin: 0 0 6px; font: 600 14px Sora, sans-serif; }
    .notes { margin: 0 0 24px; padding: 12px 14px; background: var(--paper); color: #3e4248; white-space: pre-line; }
    .t-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 18px 30px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
    .t-foot a { color: var(--ink); text-decoration: none; }
    .legal { width: 100%; font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font: 600 13px "DM Sans", sans-serif; text-decoration: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: var(--ink); }
    .msg { padding: 60px 20px; text-align: center; }
    .msg strong { font: 600 20px Sora, sans-serif; }
    .msg p { color: var(--muted); }
    @media (max-width: 520px) {
      .wrap { padding-top: 16px; }
      .t-head, .t-body, .t-foot { padding-left: 18px; padding-right: 18px; }
      .meta { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #fff; }
      .wrap { padding: 0; width: 100%; }
      .ticket { border: 0; box-shadow: none; }
      .t-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status, .bar, .bar i, .notes { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="ticket"><div class="msg"><strong>Cargando comprobante…</strong></div></div>
    <div class="actions" id="actions" hidden>
      <button class="btn" type="button" onclick="window.print()">Descargar PDF</button>
      <a class="btn btn-ghost" id="ticket-wa" href="https://wa.me/525522574365" target="_blank" rel="noopener">Dudas por WhatsApp</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const mxn = n => Number(n || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
    const fecha = v => new Date(v.length > 10 ? v : v + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    const box = document.getElementById('ticket');
    const fail = (title, text) => { box.innerHTML = `<div class="msg"><strong>${title}</strong><p>${text}</p></div>`; };

    // Ticket de ejemplo para revisar el diseño: ticket.html?demo=1
    const DEMO = {
      folio: 7, created_at: new Date().toISOString(), client_name: 'Café Raíz', client_contact: '+52 55 1234 5678',
      kind: 'web', plan: 'Recomendado', total: 12350, notes: 'El 50% restante se paga al entregar la página.',
      items: [{ concept: 'Página web · Plan Recomendado', qty: 1, price: 12000 }, { concept: 'Dominio .com (1 año)', qty: 1, price: 350 }],
      payments: [{ date: new Date().toLocaleDateString('en-CA'), amount: 6175, method: 'Transferencia', label: 'Anticipo' }]
    };

    function render(t) {
      const paid = (t.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
      const total = Number(t.total || 0);
      const due = Math.max(total - paid, 0);
      const pct = total ? Math.min(paid / total * 100, 100) : 0;
      const [label, color] = paid >= total && total > 0 ? ['Pagado', 'var(--green)'] : paid > 0 ? [t.kind === 'web' ? 'Anticipo pagado' : 'Pago parcial', 'var(--amber)'] : ['Pendiente de pago', 'var(--muted)'];
      const periodo = p => p ? new Date(+p.slice(0, 4), +p.slice(5, 7) - 1, 1).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' }).replace(' de ', ' ') : '';
      const concepto = t.kind === 'web' ? 'Pago de página web' : t.kind === 'mensualidad' ? `Mensualidad ${periodo(t.period)}` : 'Plan contratado';
      const detalle = t.kind === 'web' ? `Plan ${esc(t.plan)} · pago en dos partes: 50% de anticipo y 50% al entregar`
        : t.monthly_price != null ? `Plan ${esc(t.plan)} · <b>${mxn(t.monthly_price)}</b> /mes${t.months > 1 ? ` · ${t.months} meses` : ''}` : '';
      document.title = `Comprobante #${String(t.folio).padStart(4, '0')} · Orion Studio`;
      box.innerHTML = `
        <article class="ticket">
          <header class="t-head">
            <div class="brand"><span class="brand-mark">O<span>·</span></span><span class="brand-name">orion<span>STUDIO DIGITAL</span></span></div>
            <div class="t-doc"><small>COMPROBANTE DE PAGO</small><strong>#${String(t.folio).padStart(4, '0')}</strong></div>
          </header>
          <div class="t-body">
            <span class="status" style="--c:${color}">${label}</span>
            <div class="meta">
              <div><span class="label">Cliente</span><b>${esc(t.client_name)}</b></div>
              <div><span class="label">Fecha</span><b>${fecha(t.created_at)}</b></div>
              ${t.client_contact ? `<div style="grid-column:1/-1"><span class="label">Contacto</span><b>${esc(t.client_contact)}</b></div>` : ''}
            </div>
            <span class="label">Concepto</span>
            <p class="plan">${t.kind ? concepto : esc(t.plan)}</p>
            ${t.kind ? `<p class="plan-price">${detalle}</p>` : t.monthly_price != null ? `<p class="plan-price"><b>${mxn(t.monthly_price)}</b> /mes${t.months ? ` · ${t.months} ${t.months === 1 ? 'mes' : 'meses'}` : ''}</p>` : ''}
            <table>
              <thead><tr><th>Concepto</th><th class="num">Cant.</th><th class="num">Importe</th></tr></thead>
              <tbody>${(t.items || []).map(i => `<tr><td>${esc(i.concept)}</td><td class="num">${Number(i.qty || 1)}</td><td class="num">${mxn(Number(i.qty || 1) * Number(i.price || 0))}</td></tr>`).join('')}</tbody>
            </table>
            <div class="totals">
              <div class="grand"><span>Total</span><span>${mxn(total)}</span></div>
              <div class="paid"><span>Pagado</span><span>${mxn(paid)}</span></div>
              <div class="${due ? 'due' : ''}"><span>Saldo pendiente</span><span>${mxn(due)}</span></div>
            </div>
            <div class="bar" aria-label="${Math.round(pct)}% pagado"><i style="width:${pct}%"></i></div>
            ${(t.payments || []).length ? `<h2>Pagos recibidos</h2>
              <table><thead><tr><th>Fecha</th><th>Pago</th><th class="num">Monto</th></tr></thead>
              <tbody>${t.payments.map(p => `<tr><td>${fecha(p.date)}</td><td>${p.label ? `<b>${esc(p.label)}</b> · ` : ''}${esc(p.method || '—')}</td><td class="num">${mxn(p.amount)}</td></tr>`).join('')}</tbody></table>` : ''}
            ${t.notes ? `<h2 style="margin-top:22px">Notas</h2><p class="notes">${esc(t.notes)}</p>` : ''}
          </div>
          <footer class="t-foot">
            <span>Orion Studio · orionwebmx.com</span>
            <span><a href="mailto:orionwebstd@gmail.com">orionwebstd@gmail.com</a> · <a href="https://wa.me/525522574365">+52 55 2257 4365</a></span>
            <span class="legal">Este comprobante no es una factura fiscal (CFDI).</span>
          </footer>
        </article>`;
      const wa = document.getElementById('ticket-wa');
      wa.href = `https://wa.me/525522574365?text=${encodeURIComponent(`Hola, tengo una duda sobre mi comprobante #${String(t.folio).padStart(4, '0')}.`)}`;
      document.getElementById('actions').hidden = false;
    }

    (async () => {
      const params = new URLSearchParams(location.search);
      if (params.get('demo')) return render(DEMO);
      const token = params.get('t');
      if (!token || !/^[0-9a-f-]{36}$/i.test(token)) return fail('Enlace incompleto', 'Revisa que hayas abierto el enlace completo que te enviamos.');
      const cfg = window.ORION_SUPABASE || {};
      if (!cfg.url || !window.supabase) return fail('No disponible', 'Intenta de nuevo en unos minutos.');
      const db = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data, error } = await db.rpc('get_receipt', { p_token: token });
      if (error) return fail('No pudimos cargar el comprobante', 'Intenta de nuevo en unos minutos.');
      if (!data) return fail('Comprobante no encontrado', 'El enlace no es válido o el comprobante fue eliminado.');
      render(data);
    })();
  </script>
</body>
</html>
